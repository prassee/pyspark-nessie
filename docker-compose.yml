version: '3.8'
name: lsn
services:
  # Minio Object Storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  mc:
    image: quay.io/minio/minio:latest
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/bash
    restart: "no"
    command: >
      -c "until mc alias set myminio http://minio:9000 admin password; do
            echo 'Waiting for Minio...' && sleep 2;
          done;
          mc mb myminio/warehouse --ignore-existing;
          mc mb myminio/sdc --ignore-existing;
          mc mb myminio/cdc --ignore-existing;
          mc mb myminio/unnest --ignore-existing;
          mc mb myminio/base --ignore-existing;"
    networks:
      - spark-network


  # PostgreSQL for Nessie persistence
  postgres:
    image: postgres:15
    container_name: nessie-postgres
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL which stores master & transactional data & used for CDC replication
  ods-postgres:
    image: vijaysaran07/postgres-with-wal2json:v1.0
    container_name: ods-postgres
    environment:
      POSTGRES_DB: ods
      POSTGRES_USER: ods
      POSTGRES_PASSWORD: ods
    volumes:
      - ods_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ods -d ods"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=10
               -c max_wal_senders=10
               -c wal_keep_size=64MB
               -c track_commit_timestamp=on
               -c shared_preload_libraries='wal2json'

  # Nessie Catalog
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      - nessie.version.store.type=JDBC
      - quarkus.datasource.db-kind=postgresql
      - quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/nessie
      - quarkus.datasource.username=nessie
      - quarkus.datasource.password=nessie
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://warehouse/
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.external-endpoint=http://host.containers.internal:9000/
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=admin
      - nessie.catalog.secrets.access-key.secret=password    
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/trees"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Spark Master
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./pyspark/jobs:/opt/spark/jobs
      - ./conf:/opt/spark/conf-custom
      - ./jars:/opt/spark/jars-custom
    networks:
      - spark-network

  # Spark Worker
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    depends_on:
      - spark-master
    volumes:
      - ./pyspark/jobs:/opt/spark/jobs
      - ./conf:/opt/spark/conf-custom
      - ./jars:/opt/spark/jars-custom
    networks:
      - spark-network

  # Trino Coordinator
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8081:8080"
    environment:
      - TRINO_ENVIRONMENT=production
    volumes:
      - ./trino/etc:/etc/trino
    networks:
      - spark-network

  # Jupyter Notebook with PySpark
  # jupyter:
  #   image: jupyter/pyspark-notebook:latest
  #   container_name: jupyter-pyspark
  #   ports:
  #     - "8888:8888"
  #   environment:
  #     - JUPYTER_ENABLE_LAB=yes
  #     - SPARK_MASTER=spark://spark-master:7077
  #     - PYSPARK_SUBMIT_ARGS=--jars /opt/spark/jars-custom/*.jar pyspark-shell
  #     - GRANT_SUDO=yes
  #     - CHOWN_HOME=yes
  #     - CHOWN_HOME_OPTS=-R
  #   user: root
  #   volumes:
  #     - ./notebooks:/home/jovyan/work
  #     - ./conf:/opt/spark/conf-custom
  #     - ./jars:/opt/spark/jars-custom    
  #   networks:
  #     - spark-network
  #   command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password='' --allow-root

  olake-discover:
    image: olakego/source-postgres:latest
    container_name: olake-discover
    volumes:
      - ./olake:/mnt/config/
    command: "discover --config /mnt/config/source.json"
    networks:
      - spark-network

  olake-sync:
    image: olakego/source-postgres:latest
    container_name: olake-sync
    volumes:
      - ./olake:/mnt/config/
    command: "sync --config /mnt/config/source.json --catalog /mnt/config/cdc-streams.json --state /mnt/config/state.json --destination /mnt/config/destination-nessie.json"
    networks:
      - spark-network
  
  olake-full-sync:
    image: olakego/source-postgres:latest
    container_name: olake-full-sync
    volumes:
      - ./olake:/mnt/config/
    command: "sync --config /mnt/config/source.json --catalog /mnt/config/full-refresh-streams.json --destination /mnt/config/destination-nessie.json"
    networks:
      - spark-network

  publisher-app:
    image: python:3.12-alpine3.17
    platform: linux/amd64
    hostname: publisher-app
    container_name: publisher-app
    working_dir: /app
    volumes:
      - ./data-publish-app:/app/
    command: >
      sh -c "
      pip install --upgrade pip &&
      pip install faker psycopg2-binary &&
      python data_simulator.py 
      "      
    networks:
      - spark-network

volumes:
  minio_data:
  postgres_data:
  ods_postgres_data:

networks:
  spark-network:
    driver: bridge
