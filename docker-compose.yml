version: '3.8'
x-app-defaults:
  host_persistence_path: &hostPersistencePath ${PWD}/olake-data
  worker_config_volume_details: &workerConfigVolumeDetails
    type: bind
    source: *hostPersistencePath
    target: /tmp/olake-config

x-signup-defaults:
  username: &defaultUsername "admin"
  password: &defaultPassword "password"
  email: &defaultEmail "admin@example.com"

x-encryption:
  key: &encryptionKey "" 

services:
  
  # Minio Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  # Minio Client - Create buckets
  # minio-init:
  #   image: minio/mc:latest
  #   container_name: minio-init
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   entrypoint: >
  #     /bin/sh -c "
  #     mc alias set minio http://minio:9000 admin password;
  #     mc mb minio/warehouse --ignore-existing;
  #     mc mb minio/nessie --ignore-existing;
  #     echo 'Minio buckets created successfully';
  #     "
  #   networks:
  #     - spark-network

  # PostgreSQL for Nessie persistence
  postgres:
    image: postgres:15
    container_name: nessie-postgres
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nessie Catalog
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessie
      QUARKUS_LOG_LEVEL: INFO
      QUARKUS_LOG_CONSOLE_ENABLE: true
    depends_on:
      jaeger:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/trees"]
      interval: 30s
      timeout: 10s
      retries: 5


  # lakekeeper
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.9.3
    container_name: lakekeeper
    pull_policy: always
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://nessie:nessie@nessie-postgres:5432/lakekeeper
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://nessie:nessie@nessie-postgres:5432/lakekeeper
      - RUST_LOG=trace,axum=trace,sqlx=trace,lakekeeper=trace
    command: [ "serve" ]
    depends_on:
      lakekeeper-migrate:
          condition: service_completed_successfully
    ports:
      - "8181:8181"
    networks:
      - spark-network
  
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.9.3
    container_name: lakekeeper-migrate
    pull_policy: always
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://nessie:nessie@nessie-postgres:5432/lakekeeper
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://nessie:nessie@nessie-postgres:5432/lakekeeper
      - RUST_LOG=trace,axum=trace,sqlx=trace,lakekeeper=trace
    restart: "no"
    command: [ "migrate" ]
    networks:
      - spark-network


  # Spark Master
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./pyspark/jobs:/opt/spark/jobs
      - ./conf:/opt/spark/conf-custom
      - ./jars:/opt/spark/jars-custom
    networks:
      - spark-network

  # Spark Worker
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    depends_on:
      - spark-master
    volumes:
      - ./pyspark/jobs:/opt/spark/jobs
      - ./conf:/opt/spark/conf-custom
      - ./jars:/opt/spark/jars-custom
    networks:
      - spark-network

  # Trino Coordinator
  # trino:
  #   image: trinodb/trino:latest
  #   container_name: trino
  #   ports:
  #     - "8081:8080"
  #   environment:
  #     - TRINO_ENVIRONMENT=production
  #   volumes:
  #     - ./trino/etc:/etc/trino
  #   depends_on:
  #     nessie:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   networks:
  #     - spark-network

  # Jupyter Notebook with PySpark
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter-pyspark
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER=spark://spark-master:7077
      - PYSPARK_SUBMIT_ARGS=--jars /opt/spark/jars-custom/*.jar pyspark-shell
      - GRANT_SUDO=yes
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
    user: root
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./conf:/opt/spark/conf-custom
      - ./jars:/opt/spark/jars-custom
    depends_on:
      - spark-master
      - nessie
      - minio
    networks:
      - spark-network
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password='' --allow-root

  olake-gen-stream:
    image: olakego/source-postgres:latest
    container_name: olake-gen-stream
    volumes:
      - ./olake:/mnt/config/
    command: "discover --config /mnt/config/source.json"
    networks:
      - spark-network

  olake-sync:
    image: olakego/source-postgres:latest
    container_name: olake-sync
    volumes:
      - ./olake:/mnt/config/
    command: "sync --config /mnt/config/source.json --catalog /mnt/config/streams.json --destination /mnt/config/destination-nessie.json"
    networks:
      - spark-network

volumes:
  minio_data:
  postgres_data:

networks:
  spark-network:
    driver: bridge
